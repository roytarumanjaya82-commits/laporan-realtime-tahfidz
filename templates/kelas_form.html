{% extends "base.html" %}
{% block page_title %}{{ 'Edit' if item else 'Tambah' }} Kelas{% endblock %}
{% block content %}
<div class="panel" style="max-width:640px">
  <div class="panel-header"><h2>{{ 'Edit' if item else 'Tambah' }} Kelas</h2></div>
  <div class="panel-body">
    <form method="post" class="form-grid">
      <div>
        <label>Nama Kelas</label>
        <input type="text" name="nama" required value="{{ item.nama if item else '' }}" placeholder="7-A">
      </div>
      <div>
        <label>Jenjang</label>
        <select name="jenjang" required>
          {% for j in [7,8,9] %}
          <option value="{{ j }}" {% if item and item.jenjang == j %}selected{% endif %}>Kelas {{ j }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="full">
        <label>Musyrif Pembimbing (opsional)</label>
        <select name="musyrif_id">
          <option value="">— Belum ditentukan —</option>
          {% for m in musyrif %}
          <option value="{{ m.id }}" {% if item and item.musyrif_id == m.id %}selected{% endif %}>
            {{ m.kode }} — {{ m.nama }}{% if m.gelar %}, {{ m.gelar }}{% endif %}
          </option>
          {% endfor %}
        </select>
      </div>
      {% if item %}
      <div>
        <label>Status</label>
        <select name="aktif">
          <option value="1" {% if item.aktif %}selected{% endif %}>Aktif</option>
          <option value="0" {% if not item.aktif %}selected{% endif %}>Nonaktif</option>
        </select>
      </div>
      {% endif %}
      <div class="full form-actions">
        <button class="btn btn-primary" type="submit">Simpan</button>
        <a class="btn btn-ghost" href="{{ url_for('kelas_list') }}">Batal</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
